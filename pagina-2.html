:root{--bg:#090909;--fg:#eee;--muted:#858585;--line:#292929;--pad:clamp(20px,4vw,58px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{
  color:var(--fg);
  font-family:"Fixedsys Web","Fixedsys Excelsior",Fixedsys,monospace;
  font-weight:400;font-size:16px;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  height:100vh;height:100dvh
}
a,a:link,a:visited,a:hover,a:active{color:inherit;text-decoration:none}   /* el color del enlace no cambia al haber visitado la entrada */

/* CABECERA (estilo anterior, fija) */
.intro{
  padding:34px var(--pad) 34px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:clamp(30px,6vw,100px);
  border-bottom:1px solid var(--line)
}
.intro h1{
  flex:0 0 auto;font-size:64px;line-height:.86;font-weight:400;
  letter-spacing:0;margin:0
}
.intro-info{flex:1;max-width:920px;padding-top:5px}
.intro p{font-size:16px;color:var(--fg);margin:0 0 14px;line-height:1.5}
.intro-nav{display:flex;flex-wrap:wrap;gap:18px}
.intro-nav a{font-size:16px;color:var(--muted);transition:color .2s}
.intro-nav a:hover{color:var(--fg)}

/* CUADRÍCULA: 5 x 2, sin márgenes, línea de 1px gris */
.grid{
  min-height:0;display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:1px;background:var(--line)
}
.entry{
  min-width:0;min-height:0;overflow:hidden;position:relative;
  background:var(--bg);color:var(--fg);padding:16px;
  display:flex;flex-direction:column;justify-content:flex-end;
  transition:background .2s ease,color .2s ease
}
a.entry:hover{background:#fff;color:#000}
.entry-title{font-size:16px;line-height:1.1;max-width:90%}


/* DIBUJO DE TEXTO (Pretext): lienzo dentro de la cuadrícula; al hacer hover se invierte con la misma transición que el fondo */
.entry-art{position:relative;flex:1 1 auto;min-height:0;width:100%;margin-bottom:8px;pointer-events:none}

<script>
/* ===== Núcleo: SDF + raymarching + texto sobre superficie ===== */
const TAU = Math.PI * 2;
const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
const ellipsoid = (cx, cy, cz, rx, ry, rz) => (x, y, z) => {
  x = (x - cx) / rx; y = (y - cy) / ry; z = (z - cz) / rz;
  const k0 = Math.sqrt(x * x + y * y + z * z);
  const k1 = Math.sqrt(x * x / (rx * rx) + y * y / (ry * ry) + z * z / (rz * rz));
  return k1 < 1e-9 ? -Math.min(rx, ry, rz) : k0 * (k0 - 1) / k1;
};
/* cono redondeado (Inigo Quilez): ideal para patas, orejas y cola */
const rcone = (a, b, r1, r2) => {
  const bx = b[0] - a[0], by = b[1] - a[1], bz = b[2] - a[2];
  const l2 = bx * bx + by * by + bz * bz, rr = r1 - r2, a2 = l2 - rr * rr, il2 = 1 / l2;
  return (x, y, z) => {
    const px = x - a[0], py = y - a[1], pz = z - a[2];
    const yy = px * bx + py * by + pz * bz, zz = yy - l2;
    const qx = px * l2 - bx * yy, qy = py * l2 - by * yy, qz = pz * l2 - bz * yy;
    const x2 = qx * qx + qy * qy + qz * qz, y2 = yy * yy * l2, z2 = zz * zz * l2;
    const k = Math.sign(rr) * rr * rr * x2;
    if (Math.sign(zz) * a2 * z2 > k) return Math.sqrt(x2 + z2) * il2 - r2;
    if (Math.sign(yy) * a2 * y2 < k) return Math.sqrt(x2 + y2) * il2 - r1;
    return (Math.sqrt(x2 * a2 * il2) + yy * rr) * il2 - r1;
  };
};
/* grupo con esfera envolvente: si el punto está lejos, devuelve una cota barata */
const group = (cx, cy, cz, R, fn) => (x, y, z) => {
  const d = Math.hypot(x - cx, y - cy, z - cz) - R;
  return d > 0.25 ? d : fn(x, y, z);
};

/* ===== Forma: gato azul ruso sentado (mira hacia +z) ===== */
const CAT = {
  center: [0.1, 0.98, 0.0],  // centro de giro
  radius: 1.62,              // esfera envolvente
  top: 2.07,                // altura de las orejas (para repartir el texto)
  texRadius: 0.56,          // radio del "cilindro" de texto
  fit: [1.75, 2.1],         // tamaño (ancho, alto) en unidades para encajar en la celda
  idle: 'sway',             // reposo: balanceo
  blocks(S, cw, lh) { return [{ cols: Math.max(24, Math.round(TAU * this.texRadius * S / cw)), rows: Math.ceil((this.top + 0.1) * S / lh) + 2 }]; },
  glyph(px, py, pz, nx, ny, nz, g) {
    const b = g.blocks[0];
    let u = (Math.atan2(px - this.center[0], pz - this.center[2]) + 1.0) / TAU; u -= Math.floor(u);
    const row = Math.max(0, Math.floor((this.top - py) / g.rowH));
    return b.lines[row % b.lines.length][Math.min(b.T - 1, Math.floor(u * b.T))];
  },
  frame(t) {
    const wag = Math.sin(t * 1.4) * 0.07, wag2 = Math.sin(t * 1.4 - 0.8) * 0.05;
    const breathe = 1 + Math.sin(t * 1.9) * 0.012;
    const E = ellipsoid, R = rcone;
    // cuerpo
    const haunchL = E(0.34, 0.36, -0.08, 0.31, 0.36, 0.44);
    const haunchR = E(-0.34, 0.36, -0.08, 0.31, 0.36, 0.44);
    const rear = E(0, 0.42, -0.10, 0.40, 0.40, 0.48);
    const chest = R([0, 0.50, 0.0], [0, 1.06 * breathe, 0.12], 0.36, 0.15);
    const body = group(0, 0.65, -0.05, 0.95, (x, y, z) =>
      smin(smin(smin(haunchL(x, y, z), haunchR(x, y, z), 0.12), rear(x, y, z), 0.14), chest(x, y, z), 0.2));
    // cabeza (cuña corta, orejas grandes y separadas)
    const head = E(0, 1.42, 0.14, 0.42, 0.29, 0.32);
    const muzzle = E(0, 1.31, 0.42, 0.14, 0.10, 0.11);
    const earL = R([0.22, 1.60, 0.08], [0.42, 2.02, 0.02], 0.16, 0.03);
    const earR = R([-0.22, 1.60, 0.08], [-0.42, 2.02, 0.02], 0.16, 0.03);
    const headG = group(0, 1.5, 0.12, 0.7, (x, y, z) =>
      smin(smin(smin(head(x, y, z), muzzle(x, y, z), 0.08), earL(x, y, z), 0.05), earR(x, y, z), 0.05));
    // patas delanteras y traseras
    const legL = R([0.16, 1.0, 0.2], [0.17, 0.09, 0.36], 0.12, 0.09);
    const legR = R([-0.16, 1.0, 0.2], [-0.17, 0.09, 0.36], 0.12, 0.09);
    const pawL = E(0.17, 0.075, 0.43, 0.10, 0.07, 0.14);
    const pawR = E(-0.17, 0.075, 0.43, 0.10, 0.07, 0.14);
    const footL = E(0.40, 0.08, 0.10, 0.12, 0.08, 0.28);
    const footR = E(-0.40, 0.08, 0.10, 0.12, 0.08, 0.28);
    const legs = group(0, 0.35, 0.25, 0.8, (x, y, z) =>
      Math.min(Math.min(legL(x, y, z), legR(x, y, z)), Math.min(pawL(x, y, z), pawR(x, y, z)), footL(x, y, z), footR(x, y, z)));
    // cola enroscada con ligero vaivén
    const P = [[0.22, 0.20, -0.50], [0.62, 0.22, -0.66], [0.92, 0.55, -0.52], [0.98 + wag, 0.98, -0.36], [0.90 + wag * 2 + wag2, 1.30, -0.32]];
    const t1 = R(P[0], P[1], 0.15, 0.13), t2 = R(P[1], P[2], 0.13, 0.115),
      t3 = R(P[2], P[3], 0.115, 0.10), t4 = R(P[3], P[4], 0.10, 0.075);
    const tail = group(0.55, 0.75, -0.45, 0.72, (x, y, z) =>
      Math.min(Math.min(t1(x, y, z), t2(x, y, z)), t3(x, y, z), t4(x, y, z)));
    // ojos: se dejan huecos en el texto
    const eyes = [[0.17, 1.46, 0.40, 0.08], [-0.17, 1.46, 0.40, 0.08]];
    return {
      eyes,
      sdf(x, y, z) {
        let d = smin(body(x, y, z), headG(x, y, z), 0.16);
        d = smin(d, legs(x, y, z), 0.07);
        d = Math.min(d, tail(x, y, z));
        return Math.max(d, 0.0 - y);   // suelo plano
      }
    };
  }
};

/* ===== Texto: ajuste por palabras + justificado a N columnas ===== */
function layoutText(text, cols, rows, start = 0) {
  const words = text.replace(/\s+/g, ' ').trim().split(' ');
  const lines = []; let i = Math.floor(start * words.length), guard = 0;
  while (lines.length < rows && guard++ < 100000) {
    let line = [], len = 0;
    while (true) {
      const w = words[i % words.length];
      const add = (line.length ? 1 : 0) + w.length;
      if (len + add > cols && line.length) break;
      if (w.length > cols) { line.push(w.slice(0, cols)); len = cols; i++; break; }
      line.push(w); len += add; i++;
      if (line.length > 1 && len >= cols) break;
    }
    let gaps = line.length - 1, extra = cols - len, s = line[0];
    for (let g = 0; g < gaps; g++) {
      const n = 1 + Math.floor(extra / gaps) + (g < extra % gaps ? 1 : 0);
      s += ' '.repeat(n) + line[g + 1];
    }
    lines.push(s.padEnd(cols, ' '));
  }
  return lines;
}

/* ===== Render de un fotograma a una rejilla de caracteres ===== */
const LEVELS = 5;
const mul = (A, B) => A.map((r, i) => [0, 1, 2].map(j => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
function renderFrame(shape, st, out) {
  const { cols, rows, cw, lh, S, yaw, pitch, t, blocks } = st;
  const f = shape.frame(t), sdf = f.sdf;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), pt = pitch + (shape.basePitch || 0), cp = Math.cos(pt), sp = Math.sin(pt);
  const ro = shape.roll || 0, cr = Math.cos(ro), sr = Math.sin(ro);
  // R = Rz(roll)·Rx(pitch)·Ry(yaw)   (objeto → vista); su transpuesta lleva vista → objeto
  const RZ = [[cr, -sr, 0], [sr, cr, 0], [0, 0, 1]], RY = [[cy, 0, sy], [0, 1, 0], [-sy, 0, cy]];
  let m;
  if (shape.tumble) {          // el objeto está inclinado (roll + pitch base) y gira sobre el eje vertical de la pantalla
    const cb = Math.cos(shape.basePitch), sb = Math.sin(shape.basePitch), cpm = Math.cos(pitch), spm = Math.sin(pitch);
    m = mul(mul(mul([[1, 0, 0], [0, cpm, -spm], [0, spm, cpm]], RY), RZ), [[1, 0, 0], [0, cb, -sb], [0, sb, cb]]);
  } else m = mul(mul(RZ, [[1, 0, 0], [0, cp, -sp], [0, sp, cp]]), RY);
  const inv = (x, y, z) => [m[0][0] * x + m[1][0] * y + m[2][0] * z, m[0][1] * x + m[1][1] * y + m[2][1] * z, m[0][2] * x + m[1][2] * y + m[2][2] * z];
  const C = shape.center, BR = shape.radius;
  const dir = inv(0, 0, -1);
  const L = (() => { const v = [-0.45, 0.65, 0.62], n = Math.hypot(...v); return v.map(a => a / n); })();
  const Lo = inv(L[0], L[1], L[2]);
  const g = { blocks, S, cw, lh, rowH: lh / S };
  out.fill(0);
  for (let r = 0; r < rows; r++) {
    const vy = ((rows * lh) / 2 - (r + 0.5) * lh) / S;
    for (let c = 0; c < cols; c++) {
      const vx = ((c + 0.5) * cw - (cols * cw) / 2) / S;
      const o = inv(vx, vy, 3); o[0] += C[0]; o[1] += C[1]; o[2] += C[2];
      const ox = o[0] - C[0], oy = o[1] - C[1], oz = o[2] - C[2];
      const b = ox * dir[0] + oy * dir[1] + oz * dir[2];
      const disc = b * b - (ox * ox + oy * oy + oz * oz - BR * BR);
      if (disc < 0) continue;
      let tt = Math.max(0, -b - Math.sqrt(disc)); const tEnd = -b + Math.sqrt(disc);
      let hit = false, px = 0, py = 0, pz = 0;
      for (let i = 0; i < 40 && tt < tEnd; i++) {
        px = o[0] + dir[0] * tt; py = o[1] + dir[1] * tt; pz = o[2] + dir[2] * tt;
        const d = sdf(px, py, pz);
        if (d < 0.006) { hit = true; break; }
        tt += d * 0.95;
      }
      if (!hit) continue;
      if (f.eyes) { let eye = false; for (const e of f.eyes) if (Math.hypot(px - e[0], py - e[1], pz - e[2]) < e[3]) { eye = true; break; } if (eye) continue; }
      const h = 0.012, k1 = sdf(px + h, py - h, pz - h), k2 = sdf(px - h, py - h, pz + h), k3 = sdf(px - h, py + h, pz - h), k4 = sdf(px + h, py + h, pz + h);
      let nx = k1 - k2 - k3 + k4, ny = -k1 - k2 + k3 + k4, nz = -k1 + k2 - k3 + k4;
      const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
      const vxn = m[0][0] * nx + m[0][1] * ny + m[0][2] * nz;
      const vyn = m[1][0] * nx + m[1][1] * ny + m[1][2] * nz;
      const vzn = m[2][0] * nx + m[2][1] * ny + m[2][2] * nz;
      let lam = Math.max(0, vxn * L[0] + vyn * L[1] + vzn * L[2]);
      if (f.shadow && f.shadow(px, py, pz, Lo)) lam *= 0.25;     // sombra proyectada (p. ej. el planeta sobre los anillos)
      const rim = Math.pow(1 - Math.max(0, vzn), 2.2);
      const br = Math.min(1, 0.26 + 0.66 * lam + 0.3 * rim);
      let lvl = 1 + Math.floor(br * LEVELS); if (lvl > LEVELS) lvl = LEVELS;
      if (f.tone) lvl = Math.max(1, Math.min(LEVELS, lvl + f.tone(px, py, pz)));   // contraste entre partes (planeta / anillos)
      let ch = shape.glyph(px, py, pz, nx, ny, nz, g, f);
      if (ch === ' ') { ch = '·'; lvl = Math.max(1, lvl - 1); }   // los espacios entre palabras se marcan con un punto tenue
      out[r * cols + c] = lvl;
      st.chars[r * cols + c] = ch;
    }
  }
  // partículas (gotas, espuma): letras sueltas proyectadas sobre la rejilla, por delante de la superficie
  if (f.particles) {
    const LET = blocks._let || (blocks._let = blocks[0].lines.join('').replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g, '') || 'o');
    for (const p of f.particles) {
      const x = p[0] - C[0], y = p[1] - C[1], z = p[2] - C[2];
      const vx = m[0][0] * x + m[0][1] * y + m[0][2] * z, vy = m[1][0] * x + m[1][1] * y + m[1][2] * z;
      const c = Math.round((vx * S + cols * cw / 2) / cw - 0.5), r = Math.round((rows * lh / 2 - vy * S) / lh - 0.5);
      if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
      out[r * cols + c] = p[3]; st.chars[r * cols + c] = LET[p[4] % LET.length];
    }
  }
}

/* ===== Forma: el número 85 (dos cifras en 3D, texto por delante y por detrás) ===== */
const capsule = (a, b, r) => {
  const bx = b[0] - a[0], by = b[1] - a[1], bz = b[2] - a[2], l2 = Math.max(1e-6, bx * bx + by * by + bz * bz);
  return (x, y, z) => {
    const px = x - a[0], py = y - a[1], pz = z - a[2];
    const h = Math.max(0, Math.min(1, (px * bx + py * by + pz * bz) / l2));
    return Math.hypot(px - bx * h, py - by * h, pz - bz * h) - r;
  };
};
const ring2 = (cx, cy, rx, ry, r) => { const m = Math.min(rx, ry); return (x, y, z) => Math.hypot((Math.hypot((x - cx) / rx, (y - cy) / ry) - 1) * m, z) - r; };
const N85 = {
  center: [0.12, 1.0, 0], radius: 1.95, top: 2.1, x0: -1.3, width: 2.65,
  fit: [2.55, 2.25], idle: 'sway',
  blocks(S, cw, lh) { const c = Math.ceil(this.width * S / cw) + 1, r = Math.ceil(2.2 * S / lh) + 2; return [{ cols: c, rows: r }, { cols: c, rows: r }]; },
  glyph(px, py, pz, nx, ny, nz, g) {
    const b = g.blocks[nz >= 0 ? 0 : 1];
    let col = Math.floor((px - this.x0) / (g.cw / g.S)); if (nz < 0) col = b.T - 1 - col;   // por detrás el texto se lee del derecho
    const row = Math.max(0, Math.floor((this.top - py) / g.rowH));
    return b.lines[row % b.lines.length][((col % b.T) + b.T) % b.T];
  },
  frame() {
    if (this._f) return this._f;
    const R = 0.13, ox = 0.12;
    const top8 = ring2(-0.55, 1.50, 0.30, 0.34, R), bot8 = ring2(-0.55, 0.57, 0.38, 0.43, R);
    const eight = (x, y, z) => smin(group(-0.55, 1.5, 0, 0.62, top8)(x, y, z), group(-0.55, 0.57, 0, 0.7, bot8)(x, y, z), 0.1);
    // el 5: barra superior + vertical, y panza en arco (arco elíptico exacto con dos remates)
    const bar = capsule([0.38 + ox, 1.87, 0], [1.05 + ox, 1.87, 0], R), vert = capsule([0.40 + ox, 1.87, 0], [0.34 + ox, 1.10, 0], R);
    const cx = 0.62 + ox, cy = 0.64, rx = 0.47, ry = 0.50, a0 = 128 * Math.PI / 180, a1 = -150 * Math.PI / 180, m = Math.min(rx, ry);
    const e0 = [cx + rx * Math.cos(a0), cy + ry * Math.sin(a0)], e1 = [cx + rx * Math.cos(a1), cy + ry * Math.sin(a1)];
    const arc = (x, y, z) => {
      const th = Math.atan2((y - cy) / ry, (x - cx) / rx);
      if (th <= a0 && th >= a1) return Math.hypot((Math.hypot((x - cx) / rx, (y - cy) / ry) - 1) * m, z) - R;
      return Math.min(Math.hypot(x - e0[0], y - e0[1], z), Math.hypot(x - e1[0], y - e1[1], z)) - R;
    };
    const five = (x, y, z) => smin(group(0.85, 1.6, 0, 0.7, (x, y, z) => smin(bar(x, y, z), vert(x, y, z), 0.06))(x, y, z), group(cx, cy, 0, 0.8, arc)(x, y, z), 0.06);
    this._f = { sdf: (x, y, z) => smin(eight(x, y, z), five(x, y, z), 0.04) };
    return this._f;
  }
};

/* ===== Forma: Saturno (anillo fino; al girar, el anillo pasa de inclinarse hacia arriba a hacia abajo) ===== */

/* ===== Ayudas para formas "planas con volumen": el texto se proyecta por delante, por detrás, por los lados y por arriba ===== */
const rbox = (cx, cy, cz, hx, hy, hz, r) => (x, y, z) => {
  const qx = Math.abs(x - cx) - (hx - r), qy = Math.abs(y - cy) - (hy - r), qz = Math.abs(z - cz) - (hz - r);
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, Math.max(qy, qz)), 0) - r;
};
const smooth01 = u => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
function planar(def) {   // def: {x0,width,z0,depth,top,height}
  return {
    blocks(S, cw, lh) {
      const c = Math.ceil(def.width * S / cw) + 1, r = Math.ceil(def.height * S / lh) + 2;
      const cs = Math.ceil(def.depth * S / cw) + 1, rt = Math.ceil(def.depth * S / lh) + 2;
      return [{ cols: c, rows: r }, { cols: c, rows: r }, { cols: cs, rows: r }, { cols: c, rows: rt }];
    },
    glyph(px, py, pz, nx, ny, nz, g) {
      const ax = Math.abs(nx), ay = Math.abs(ny), az = Math.abs(nz), cwW = g.cw / g.S, rowH = g.rowH;
      let bi, col, row;
      if (ay > ax && ay > az) { bi = 3; col = (px - def.x0) / cwW; row = (def.z0 + def.depth - pz) / rowH; }
      else if (ax > az) { bi = 2; col = nx > 0 ? (def.z0 + def.depth - pz) / cwW : (pz - def.z0) / cwW; row = (def.top - py) / rowH; }
      else { bi = nz >= 0 ? 0 : 1; col = (px - def.x0) / cwW; if (nz < 0) col = g.blocks[1].T - 1 - col; row = (def.top - py) / rowH; }
      const b = g.blocks[bi]; col = Math.floor(col); row = Math.max(0, Math.floor(row));
      return b.lines[row % b.lines.length][((col % b.T) + b.T) % b.T];
    }
  };
}

/* ===== Forma: arco lanzando una flecha hacia un corazón ===== */
const heart2 = (px, py) => {
  px = Math.abs(px);
  if (py + px > 1) { const dx = px - 0.25, dy = py - 0.75; return Math.sqrt(dx * dx + dy * dy) - Math.SQRT2 / 4; }

const ARCHERY = Object.assign({

/* ===== Forma: boxeador golpeando un saco ===== */
const BOXER = Object.assign({
  center: [0.28, 1.25, 0], radius: 2.0, fit: [2.95, 2.5], idle: 'sway', sway: [0.45, 0.4, 0.5], swing: 0.85,
  frame(t) {
    // ciclo de golpeo: dos puñetazos alternos y una pausa
    const T = 1.9, p = (t % T) / T;
    const punch = u => { u = Math.max(0, Math.min(1, u)); return u < 0.35 ? smooth01(u / 0.35) : smooth01(1 - (u - 0.35) / 0.65); };
    const jab = punch(p / 0.42), cross = punch((p - 0.44) / 0.42);
    const hit = Math.max(jab, cross), bob = 0.035 * Math.sin(p * TAU * 2);
    // el saco retrocede con el impacto y vuelve oscilando
    const kick = 0.34 * hit * hit, swingBag = kick + 0.09 * Math.sin(t * 3.4) * (1 - hit);
    const bx = 0.86 + swingBag * 0.55, bz = -0.12;
    const bag = (x, y, z) => {
      const yy = Math.max(0, Math.min(1, (1.92 - y) / 1.5));                 // 0 arriba, 1 abajo
      const cxx = bx + swingBag * yy * 0.75, w = 0.3 + 0.045 * Math.sin(yy * 3.1);
      const r = Math.hypot(x - cxx, z - bz) - w, dy = Math.abs(y - 1.17) - 0.72;
      const body = Math.min(Math.max(r, dy), 0) + Math.hypot(Math.max(r, 0), Math.max(dy, 0)) - 0.07;
      const chain = capsule([bx + swingBag * 0.1, 1.9, bz], [bx, 2.45, bz], 0.03)(x, y, z);
      return Math.min(body, chain);
    };
    const hx = -0.62, B = (dx, dy, dz, r) => [hx + dx, dy + bob, dz, r];
    const head = ellipsoid(hx + 0.05, 1.63 + bob, 0.02, 0.17, 0.2, 0.17);
    const torso = rcone([hx, 1.42 + bob, 0], [hx - 0.03, 0.92 + bob, 0], 0.26, 0.21);
    const hips = ellipsoid(hx - 0.03, 0.86 + bob, 0, 0.24, 0.16, 0.2);
    // piernas: una adelantada, el peso cambia con el golpe
    const legF = rcone([hx + 0.12, 0.86, 0.16], [hx + 0.3 + 0.07 * hit, 0.06, 0.26], 0.13, 0.08);
    const legB = rcone([hx - 0.14, 0.86, -0.14], [hx - 0.42, 0.06, -0.3], 0.13, 0.08);
    // brazos: el que golpea se estira hacia el saco, el otro protege la cara
    const arm = (ext, side) => {
      const sh = [hx + 0.02, 1.36 + bob, side * 0.22];
      const gx = hx + 0.22 + ext * 0.82, gy = 1.42 + bob - ext * 0.06, gz = side * (0.2 - ext * 0.14);
      const ex = (sh[0] + gx) / 2 + 0.04, ey = (sh[1] + gy) / 2 - 0.16 + ext * 0.14, ez = (sh[2] + gz) / 2 + side * 0.08;
      const up = capsule(sh, [ex, ey, ez], 0.095), fore = capsule([ex, ey, ez], [gx, gy, gz], 0.085);
      const glove = ellipsoid(gx + 0.08, gy, gz, 0.15, 0.13, 0.13);
      return (x, y, z) => Math.min(up(x, y, z), fore(x, y, z), glove(x, y, z));
    };
    const armL = arm(jab, 1), armR = arm(cross, -1);
    const boxer = group(hx, 1.0, 0, 1.35, (x, y, z) => {
      let d = smin(torso(x, y, z), hips(x, y, z), 0.1);
      d = smin(d, head(x, y, z), 0.09);
      d = smin(d, armL(x, y, z), 0.07); d = smin(d, armR(x, y, z), 0.07);

      return Math.max(d, -y);
    });
    return { sdf: (x, y, z) => Math.min(boxer(x, y, z), group(bx + swingBag * 0.4, 1.3, bz, 1.5, bag)(x, y, z)) };
  }
}, planar({ x0: -1.65, width: 3.1, z0: -0.6, depth: 1.2, top: 2.5, height: 2.6 }));

    // bracitos
    const arm = side => { const s0 = [0.45, by - 0.02, side * 0.2], e = [0.58, by - 0.16, side * 0.24], h = [0.7, by - 0.1, side * 0.22];
      const a1 = capsule(s0, e, 0.045), a2 = capsule(e, h, 0.035); return (x, y, z) => Math.min(a1(x, y, z), a2(x, y, z)); };
    const armL = arm(1), armR = arm(-1);
    // patas: cinemática inversa (rodilla hacia delante, como las aves)
    const L1 = 0.4, L2 = 0.4;
    const leg = (side, off) => {
      const p = ph + off, hip = [0.02, by - 0.12, side * 0.2];
      const fx = 0.04 - 0.3 * Math.cos(p), fy = 0.1 + Math.max(0, 0.17 * Math.sin(p));
      let dx = fx - hip[0], dy = fy - hip[1]; const d = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.02);
      const ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy);
      const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
      const kx = hip[0] + ux * a + uy * h, ky = hip[1] + uy * a - ux * h;   // la articulación se dobla hacia atrás, como en las aves
      const ax = hip[0] + ux * d, ay = hip[1] + uy * d;
      const thigh = rcone(hip, [kx, ky, side * 0.21], 0.27, 0.15), shin = rcone([kx, ky, side * 0.21], [ax, ay, side * 0.22], 0.14, 0.09);
      const foot = ellipsoid(ax + 0.13, Math.max(0.055, ay - 0.02), side * 0.22, 0.23, 0.065, 0.12);
      return (x, y, z) => Math.min(thigh(x, y, z), shin(x, y, z), foot(x, y, z));
    };
    const legL = leg(1, 0), legR = leg(-1, Math.PI);
    const eyes = [[0.98, by + 0.6, 0.13, 0.045], [0.98, by + 0.6, -0.13, 0.045]];
    return {
      eyes,
      sdf: (x0, y0, z) => {
        const [x, y] = rot(x0, y0);
        let d = smin(body(x, y, z), belly(x, y, z), 0.12);
        d = smin(d, neck(x, y, z), 0.12);
        // la cabeza se mantiene horizontal aunque el tronco esté erguido
        const hx0 = x - 0.7, hy0 = y - (by + 0.42), hx = hx0 * HC - hy0 * HS + 0.7, hy = hx0 * HS + hy0 * HC + by + 0.42;
        d = smin(d, smin(skull(hx, hy, z), snout(hx, hy, z), 0.08), 0.08);
        d = Math.min(d, jaw(hx, hy, z));
        d = smin(d, tail[0](x, y, z), 0.12); d = smin(d, tail[1](x, y, z), 0.06); d = smin(d, tail[2](x, y, z), 0.04);
        d = smin(d, armL(x, y, z), 0.04); d = smin(d, armR(x, y, z), 0.04);
        d = smin(d, legL(x0, y0, z), 0.1); d = smin(d, legR(x0, y0, z), 0.1);
        return Math.max(d, -y0);
      }
    };
  }
}, planar({ x0: -1.55, width: 2.95, z0: -0.4, depth: 0.8, top: 1.85, height: 1.95 }));


/* ===== Navegador: lienzo, animación e interacción ===== */
(() => {
  const FONT = '13px "Fixedsys Excelsior", Fixedsys, monospace';
  const LH = 12;                                   // alto de línea del dibujo (px)
  const ALPHA = [0, .42, .56, .7, .85, 1];      // niveles de brillo
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TEXTS = JSON.parse(document.getElementById('ascii-text').textContent);
  const SHAPES = { cat: CAT, n85: N85, saturn: SATURN, archery: ARCHERY, mountains: MOUNTAINS, couch: COUCH, boxer: BOXER, trex: TREX };   // data-shape="cat" → CAT, etc. Añade aquí las demás formas.

  /* PRETEXT: toda la medición de texto pasa por esta función. Fixedsys es monoespaciada,
     así que basta una medida. Si más adelante usas una fuente proporcional (como en la demo
     de Pretext), sustituye este cuerpo por prepareWithSegments()/layoutWithLines() de
     @chenglou/pretext y devuelve el ancho de cada carácter. */
  function measureCell() {
    const c = document.createElement('canvas').getContext('2d');
    c.font = FONT;
    return { cw: c.measureText('M').width, lh: LH };
  }

  const arts = [];
  class Art {
    constructor(el, shape, text) {
      this.el = el; this.shape = shape; this.text = text;
      const wrap = document.createElement('div'); wrap.className = 'entry-art'; wrap.setAttribute('aria-hidden', 'true');
      this.canvas = document.createElement('canvas'); wrap.appendChild(this.canvas);
      el.insertBefore(wrap, el.firstChild);
      if (shape.fullCell) wrap.classList.add('full');   // el dibujo usa toda la celda; el título queda encima, abajo a la izquierda
      this.wrap = wrap; this.ctx = this.canvas.getContext('2d');
      this.yaw = (shape.sway || [0.5])[0]; this.vel = 0; this.pitch = 0; this.pitchT = 0; this.hover = false;
      this.t = Math.random() * 10; this.visible = true; this.acc = 0; this.cost = 0;
      el.addEventListener('pointerenter', () => { this.hover = true; });
      el.addEventListener('pointerleave', () => { this.hover = false; this.pitchT = 0; });
      el.addEventListener('focus', () => { this.hover = true; });
      el.addEventListener('blur', () => { this.hover = false; });
      el.addEventListener('pointermove', e => {
        const r = el.getBoundingClientRect();
        this.pitchT = ((e.clientY - r.top) / r.height - 0.5) * 0.5;
      });
      new ResizeObserver(() => this.resize()).observe(wrap);
      new IntersectionObserver(es => { this.visible = es[0].isIntersecting; }).observe(wrap);
      this.resize();
    }
    resize() {
      const w = this.wrap.clientWidth, h = this.wrap.clientHeight;
      if (!w || !h) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2), { cw, lh } = measureCell();
      this.dpr = dpr; this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr);
      this.cols = Math.floor(w / cw); this.rows = Math.floor(h / lh); this.cw = cw; this.lh = lh;
      this.ox = (w - this.cols * cw) / 2; this.oy = (h - this.rows * lh) / 2;
      const sh = this.shape;
      this.S = Math.min(this.rows * lh / sh.fit[1], this.cols * cw / sh.fit[0]);
      const bl = sh.blocks(this.S, cw, lh);
      this.blocks = bl.map((b, i) => ({ T: b.cols, lines: layoutText(this.text, b.cols, b.rows, i / bl.length) }));
      this.stars = null;
      this.cells = new Uint8Array(this.cols * this.rows); this.chars = new Array(this.cols * this.rows);
      this.draw();
    }
    step(dt) {
      this.t += dt;
      const wrapPi = a => a - TAU * Math.round(a / TAU);
      if (this.shape.idle === 'spin') {            // giro continuo sobre su propio eje (p. ej. Saturno)
        const target = REDUCED ? 0 : this.shape.spin[this.hover ? 1 : 0];
        this.vel += (target - this.vel) * Math.min(1, dt * 2.5); this.yaw += this.vel * dt;
      } else if (this.hover && !REDUCED && this.shape.swing) {   // formas planas: oscilan en vez de dar la vuelta completa (no se quedan de canto)
        const sw = this.shape.sway, target = sw[0] + this.shape.swing * Math.sin(this.t * 1.7);
        this.yaw += (target - this.yaw) * Math.min(1, dt * 4);
      } else if (this.hover && !REDUCED) { this.vel += (1.15 - this.vel) * Math.min(1, dt * 3); this.yaw += this.vel * dt; }
      else {
        this.vel += (0 - this.vel) * Math.min(1, dt * 4);
        const sw = this.shape.sway || [0.5, 0.38, 0.55], target = REDUCED ? sw[0] : sw[0] + sw[1] * Math.sin(this.t * sw[2]);
        this.yaw += wrapPi(target - this.yaw) * Math.min(1, dt * 2.2) + this.vel * dt;
      }
      this.pitch += (this.pitchT - this.pitch) * Math.min(1, dt * 5);
    }
    /* Estrellas: letras sueltas del texto en celdas vacías que parpadean en escala de grises */
    makeStars() {
      const { cols, rows, cells } = this, free = [];
      let seed = 0; for (const ch of this.el.dataset.slug) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
      const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let x = seed; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        let ok = true;
        for (let dr = -1; dr <= 1 && ok; dr++) for (let dc = -1; dc <= 1; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr >= 0 && rr < rows && cc >= 0 && cc < cols && cells[rr * cols + cc]) { ok = false; break; }
        }
        if (ok) free.push(r * cols + c);
      }
      for (let i = free.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [free[i], free[j]] = [free[j], free[i]]; }
      const letters = this.text.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g, '');
      const n = Math.min(free.length, Math.max(4, Math.round(cols * rows * this.shape.stars)));
      this.stars = [];
      for (let k = 0; k < n; k++) {
        // se evita que dos estrellas queden en celdas vecinas
        const i = free[k];
        if (this.stars.some(s => Math.abs((s.i % cols) - (i % cols)) < 3 && Math.abs(Math.floor(s.i / cols) - Math.floor(i / cols)) < 2)) continue;
        this.stars.push({ i, ch: letters[Math.floor(rnd() * letters.length)], ph: rnd() * TAU, rate: 0.7 + rnd() * 1.5 });
      }
    }
    drawStars() {
      if (!this.stars) this.makeStars();
      const k = (this.hover ? 2 : 1) * (REDUCED ? 0 : 1);
      for (const s of this.stars) {
        let v = 0.5 + 0.5 * Math.sin(this.t * s.rate * k + s.ph); v *= v;
        const lvl = Math.round(v * LEVELS);
        if (lvl > 0 && !this.cells[s.i]) { this.cells[s.i] = lvl; this.chars[s.i] = s.ch; }
      }
    }
    draw() {
      if (!this.cells) return;
      renderFrame(this.shape, { cols: this.cols, rows: this.rows, cw: this.cw, lh: this.lh, S: this.S,
        yaw: this.yaw, pitch: this.pitch, t: REDUCED ? 0 : this.t, blocks: this.blocks, chars: this.chars }, this.cells);
      if (this.shape.stars) this.drawStars();
      const c = this.ctx, d = this.dpr;
      c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, this.canvas.width, this.canvas.height);
      c.font = FONT; c.textBaseline = 'alphabetic';
      for (let l = 1; l <= LEVELS; l++) {
        c.fillStyle = `rgba(255,255,255,${ALPHA[l]})`;
        for (let r = 0; r < this.rows; r++) for (let k = 0; k < this.cols; k++) {
          const i = r * this.cols + k;
          if (this.cells[i] === l) c.fillText(this.chars[i], Math.round((this.ox + k * this.cw) * d) / d, Math.round((this.oy + (r + 0.8) * this.lh) * d) / d);
        }
      }
    }
  }

  function boot() {
    document.querySelectorAll('a.entry[data-shape]').forEach(el => {
      const shape = SHAPES[el.dataset.shape], text = TEXTS[el.dataset.slug];
      if (shape && text) arts.push(new Art(el, shape, text));
    });
    if (!arts.length || REDUCED) {
      // con movimiento reducido: un fotograma fijo, y se redibuja al cambiar de tamaño
      return;
    }
    let last = performance.now();
    (function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000);
      if (document.hidden) { last = now; return; }
      for (const a of arts) {
        if (!a.visible) continue;
        a.acc += dt;
        // reposo a 30 fps; con hover a 60 fps, salvo que el fotograma cueste más de ~10 ms (celdas grandes)
        const every = a.hover && a.cost < 10 ? 0 : 1 / 30;
        if (a.acc >= every) { a.step(a.acc); const t0 = performance.now(); a.draw(); a.cost += (performance.now() - t0 - a.cost) * 0.2; a.acc = 0; }
      }
      last = now;
    })(last);
  }
  (document.fonts && document.fonts.load ? document.fonts.load(FONT) : Promise.resolve()).then(boot, boot);
})();
</script>
